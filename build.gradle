plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'space.rawrclient.catovg'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    api 'org.lwjgl:lwjgl:3.4.1'
    api 'org.lwjgl:lwjgl-nanovg:3.4.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
